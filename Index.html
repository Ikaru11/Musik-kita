<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#121110">
<title>Musik Kita</title>
<style>
:root{--bg:#121110;--tx:#e9e2d0;--mu:#8d8676;--ln:#2b2824;--ac:#e8a33d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif;padding-bottom:250px}
header{padding:18px 16px 12px;border-bottom:1px solid var(--ln);position:sticky;top:0;background:var(--bg);z-index:5}
h1{margin:0 0 12px;font:italic 26px Georgia,serif;letter-spacing:-.5px}
h1 span{color:var(--ac)}
.row{display:flex;gap:0}
input[type=text]{flex:1;padding:10px 12px;border:1px solid var(--ln);border-right:0;background:transparent;color:var(--tx);font:inherit;border-radius:0;min-width:0}
button{background:transparent;color:var(--tx);border:1px solid var(--ln);padding:9px 13px;font:12px ui-monospace,Consolas,monospace;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;border-radius:0}
button:hover{border-color:var(--ac);color:var(--ac)}
button.p{background:var(--ac);border-color:var(--ac);color:#121110;font-weight:700}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tabs button{padding:6px 10px;font-size:11px}
.tabs button.on{border-color:var(--ac);color:var(--ac)}
#msg{padding:18px 16px;color:var(--mu);font:13px ui-monospace,Consolas,monospace;white-space:pre-wrap}
.t{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--ln);cursor:pointer}
.t:hover{background:#1a1816}
.t.on{background:#1f1b15;box-shadow:inset 3px 0 var(--ac)}
.t i{font:11px ui-monospace,Consolas,monospace;color:var(--mu);font-style:normal}
.t b{display:block;font:italic 16px Georgia,serif;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t small{color:var(--mu);font-size:12px}
.t div{min-width:0}
#bar{position:fixed;bottom:0;left:0;right:0;background:#0c0b0a;border-top:1px solid var(--ac);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
#now{font:italic 18px Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sub{color:var(--mu);font-size:12px;margin-bottom:8px}
input[type=range]{width:100%;accent-color:var(--ac);margin:4px 0}
.ctl{display:flex;gap:6px;margin-top:6px}.ctl button{flex:1}
#eq{display:none;margin-top:10px}#eq.open{display:block}
.bands{display:flex;gap:6px}
.bands label{flex:1;text-align:center;font:10px ui-monospace,Consolas,monospace;color:var(--mu)}
.pre{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.pre button{padding:5px 9px;font-size:10px}
.vl{font:10px ui-monospace,Consolas,monospace;color:var(--mu);text-transform:uppercase}
</style></head><body>
<header>
<h1>Musik <span>Kita</span></h1>
<div class="row"><input type="text" id="q" placeholder="Cari lagu atau artis"><button class="p" id="go">Cari</button></div>
<div class="tabs"><button id="tr">Trending</button><button id="lc">File lokal</button><button id="ai" class="on">Tanpa musik AI</button></div>
<input type="file" id="fl" accept="audio/*" multiple hidden>
</header>
<div id="msg"></div><div id="list"></div>
<div id="bar">
<div id="now">Belum ada lagu</div><div id="sub">Pilih lagu untuk mulai</div>
<input type="range" id="seek" min="0" max="1000" value="0">
<div class="ctl"><button id="pv">Prev</button><button class="p" id="pp">Putar</button><button id="nx">Next</button><button id="eb">EQ</button></div>
<div id="eq"><div class="pre" id="pre"></div><div class="bands" id="bands"></div>
<div class="vl">Volume<input type="range" id="vol" min="0" max="100" value="90"></div></div>
</div>
<script>
const APP='MusikKita',$=id=>document.getElementById(id);
let hosts=null,good=null,q=[],cur=-1,ctx=null,filters=[],noAI=true,lastReq=null;
const audio=new Audio();audio.preload='auto';
const F=[60,230,910,3600,14000],P={Flat:[0,0,0,0,0],"Bass Boost":[7,4,0,0,0],Vokal:[-2,0,4,3,0],Treble:[0,0,0,4,7],Jernih:[3,0,-1,2,4]};
const AIRE=/\b(ai|a\.i\.|suno|udio|ai[- ]?generated|ai[- ]?music|made with ai|generated by)\b/i;
async function tryFetch(url){const c=new AbortController();const t=setTimeout(()=>c.abort(),9000);
  try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(t)}}
async function getHosts(){if(hosts)return hosts;hosts=['https://api.audius.co'];
  try{const j=await tryFetch('https://api.audius.co');hosts.push(...j.data.sort(()=>Math.random()-.5))}catch(e){}return hosts}
async function api(p){const hs=await getHosts();const order=good?[good,...hs.filter(h=>h!==good)]:hs;let err;
  for(const h of order.slice(0,6)){try{const j=await tryFetch(h+'/v1'+p+(p.includes('?')?'&':'?')+'app_name='+APP);good=h;return j.data}catch(e){err=e}}
  throw err||new Error('gagal')}
function toTracks(d){return d.filter(t=>t.is_streamable!==false).filter(t=>!(noAI&&AIRE.test([t.title,t.tags,t.description].join(' ')))).map(t=>({title:t.title,artist:t.user&&t.user.name,src:good+'/v1/tracks/'+t.id+'/stream?app_name='+APP}))}
function show(t){q=t;$('msg').textContent=t.length?'':'Tidak ada hasil.';const l=$('list');l.innerHTML='';
  t.forEach((x,i)=>{const d=document.createElement('div');d.className='t';d.id='t'+i;
    const n=document.createElement('i');n.textContent=String(i+1).padStart(2,'0');
    const b=document.createElement('div');const a=document.createElement('b');a.textContent=x.title;const s=document.createElement('small');s.textContent=x.artist||'';
    b.append(a,s);d.append(n,b);d.onclick=()=>play(i);l.append(d)})}
async function load(p){lastReq=p;$('msg').textContent='Memuat...';$('list').innerHTML='';
  try{show(toTracks(await api(p)))}catch(e){
    let m='Gagal terhubung ke server musik ('+(e.message||e)+').\nCoba: pastikan internet aktif, lalu tekan Trending lagi.';
    if(window.self!==window.top)m+='\n\nHalaman ini terbuka di dalam pratinjau yang memblokir internet. Unduh file lalu buka langsung di Chrome.';
    $('msg').textContent=m}}
function initCtx(){if(ctx)return;ctx=new(window.AudioContext||window.webkitAudioContext)();
  const s=ctx.createMediaElementSource(audio);let n=s;
  filters=F.map((f,i)=>{const b=ctx.createBiquadFilter();b.type=i==0?'lowshelf':i==4?'highshelf':'peaking';b.frequency.value=f;b.Q.value=1;b.gain.value=+$('b'+i).value;n.connect(b);n=b;return b});
  n.connect(ctx.destination)}
function play(i,retry){if(i<0||i>=q.length)return;cur=i;const t=q[i];
  document.querySelectorAll('.t.on').forEach(e=>e.classList.remove('on'));const e=$('t'+i);if(e)e.classList.add('on');
  $('now').textContent=t.title;$('sub').textContent=t.artist||'';
  if(!retry)audio.crossOrigin=(t.local||ctx&&false)?null:'anonymous';
  audio.src=t.src;try{initCtx();ctx.resume()}catch(x){}
  audio.play().catch(()=>{});
  if('mediaSession'in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist||''});
    navigator.mediaSession.setActionHandler('nexttrack',()=>play(cur+1));navigator.mediaSession.setActionHandler('previoustrack',()=>play(cur-1))}}
audio.onerror=()=>{if(audio.crossOrigin&&!ctx){audio.crossOrigin=null;play(cur,true)}else $('sub').textContent='Lagu gagal diputar, coba yang lain'};
audio.onplay=()=>$('pp').textContent='Jeda';audio.onpause=()=>$('pp').textContent='Putar';
audio.onended=()=>play(cur+1);
audio.ontimeupdate=()=>{if(audio.duration)$('seek').value=audio.currentTime/audio.duration*1000};
$('seek').oninput=e=>{if(audio.duration)audio.currentTime=e.target.value/1000*audio.duration};
$('pp').onclick=()=>{if(cur<0&&q.length)play(0);else audio.paused?audio.play():audio.pause()};
$('nx').onclick=()=>play(cur+1);$('pv').onclick=()=>play(cur-1);
$('vol').oninput=e=>audio.volume=e.target.value/100;audio.volume=.9;
$('eb').onclick=()=>$('eq').classList.toggle('open');
F.forEach((f,i)=>{const l=document.createElement('label');l.innerHTML=(f>=1000?f/1000+'k':f)+'<input type="range" min="-12" max="12" value="0" id="b'+i+'">';$('bands').append(l);
  l.querySelector('input').oninput=e=>{if(filters[i])filters[i].gain.value=+e.target.value}});
Object.keys(P).forEach(k=>{const b=document.createElement('button');b.textContent=k;b.onclick=()=>P[k].forEach((v,i)=>{$('b'+i).value=v;if(filters[i])filters[i].gain.value=v});$('pre').append(b)});
$('go').onclick=()=>{const v=$('q').value.trim();if(v)load('/tracks/search?query='+encodeURIComponent(v)+'&limit=50')};
$('q').onkeydown=e=>{if(e.key==='Enter')$('go').click()};
$('tr').onclick=()=>load('/tracks/trending?limit=50');
$('ai').onclick=()=>{noAI=!noAI;$('ai').classList.toggle('on',noAI);$('ai').textContent=noAI?'Tanpa musik AI':'Semua musik';if(lastReq)load(lastReq)};
$('lc').onclick=()=>$('fl').click();
$('fl').onchange=e=>{const t=[...e.target.files].map(f=>({title:f.name.replace(/\.[^.]+$/,''),artist:'File lokal',src:URL.createObjectURL(f),local:true}));if(t.length){show(t);play(0)}};
$('tr').click();
</script></body></html>
